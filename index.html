<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 — Betting Tracker</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #131929;
      --surface2: #1c2540;
      --border: #2a3550;
      --accent: #3b82f6;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e2e8f0;
      --muted: #64748b;
      --win: #10b981;
      --loss: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-weight: 700; font-size: 16px; padding: 14px 16px 14px 0; color: var(--accent); white-space: nowrap; }
    .nav-tabs { display: flex; }
    .nav-tab { padding: 14px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap; }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .stats-bar { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
    .stat-pill { padding: 10px 20px; text-align: center; border-right: 1px solid var(--border); flex-shrink: 0; }
    .stat-pill .val { font-size: 20px; font-weight: 700; }
    .stat-pill .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .stat-pill.green .val { color: var(--win); }
    .stat-pill.red .val { color: var(--loss); }
    .stat-pill.yellow .val { color: var(--yellow); }
    .stat-pill.blue .val { color: var(--accent); }

    .page { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
    .page.active { display: block; }

    /* GROUPS */
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .group-header { background: var(--surface2); padding: 10px 14px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
    .group-team-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); }
    .group-team-row:last-child { border-bottom: none; }
    .team-name { display: flex; align-items: center; gap: 8px; }
    .team-stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
    .team-pts { font-weight: 700; color: var(--text); }
    .qual-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .qual-dot.q1 { background: var(--win); }
    .qual-dot.q2 { background: var(--accent); }

    /* MATCHES */
    .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
    .section-title:first-child { margin-top: 0; }
    .match-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px; }
    .match-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color .15s; }
    .match-card:hover { border-color: var(--accent); }
    .match-card.has-bet { border-left: 3px solid var(--accent); }
    .match-card.win  { border-left: 3px solid var(--win); }
    .match-card.loss { border-left: 3px solid var(--loss); }
    .match-card.push { border-left: 3px solid var(--yellow); }
    .match-meta { font-size: 11px; color: var(--muted); min-width: 72px; }
    .match-teams { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
    .match-vs { color: var(--muted); font-size: 11px; font-weight: 400; }
    .match-score { font-size: 13px; color: var(--muted); min-width: 44px; text-align: center; }
    .bet-pill { font-size: 11px; min-width: 110px; text-align: right; }
    .bet-pill.win  { color: var(--win); }
    .bet-pill.loss { color: var(--loss); }
    .bet-pill.push { color: var(--yellow); }
    .bet-pill.pend { color: var(--muted); }

    /* FILTERS */
    .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-btn { padding: 5px 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); cursor: pointer; font-size: 12px; transition: all .15s; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* MODAL */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 440px; margin: 16px; }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    .field input, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px; color: var(--text); font-size: 14px; outline: none; transition: border-color .15s; }
    .field input:focus { border-color: var(--accent); }
    .pick-row { display: flex; gap: 6px; }
    .pick-btn { flex: 1; padding: 9px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 500; text-align: center; transition: all .15s; }
    .pick-btn:hover { border-color: var(--accent); }
    .pick-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--loss); color: #fff; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .score-row { display: flex; gap: 8px; align-items: flex-start; }
    .score-wrap { flex: 1; }
    .score-sep { padding-top: 9px; color: var(--muted); }
    .score-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; text-align: center; }

    /* BETS TABLE */
    .bets-table { width: 100%; border-collapse: collapse; }
    .bets-table th { text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--border); }
    .bets-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .bets-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-win  { background: rgba(16,185,129,.15); color: var(--win); }
    .badge-loss { background: rgba(239,68,68,.15);  color: var(--loss); }
    .badge-push { background: rgba(245,158,11,.15); color: var(--yellow); }
    .badge-pend { background: rgba(100,116,139,.15);color: var(--muted); }

    /* BRACKET */
    .bracket-wrap { overflow-x: auto; padding-bottom: 12px; }
    .bracket { display: flex; gap: 32px; align-items: flex-start; min-width: 860px; padding: 4px 0; }
    .b-round { display: flex; flex-direction: column; }
    .b-round-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; text-align: center; }
    .b-match { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; width: 154px; cursor: pointer; transition: border-color .15s; margin-bottom: 6px; }
    .b-match:hover { border-color: var(--accent); }
    .b-match.has-bet { border-left: 3px solid var(--accent); }
    .b-match.win  { border-left: 3px solid var(--win); }
    .b-match.loss { border-left: 3px solid var(--loss); }
    .b-team { font-size: 12px; padding: 2px 0; display: flex; justify-content: space-between; }
    .b-team.winner { color: var(--win); font-weight: 700; }
    .b-score { color: var(--muted); font-size: 11px; }

    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    @media (max-width: 600px) {
      nav { padding: 0 10px; }
      .page { padding: 12px; }
      .match-teams { font-size: 12px; }
      .bet-pill { display: none; }
    }
  </style>
</head>

        </div>
      </div>
    </div>

    <div class="modal-actions">

  </div>
</div>

let KO_MATCHES = [];
let koId = 1000;
for (const r of KO_ROUNDS) {
  for (let i = 0; i < r.count; i++) {
    KO_MATCHES.push({ id: koId++, stage: r.round, home:'TBD', away:'TBD', date: r.date, ko: true });
  }
}

const MATCHES = [...GROUP_MATCHES, ...KO_MATCHES];

// ─── STATE ────────────────────────────────────────────────────────────────

let bets = JSON.parse(localStorage.getItem('wc2026_bets') || '{}');
function saveBets() { localStorage.setItem('wc2026_bets', JSON.stringify(bets)); }

// ─── STATS ────────────────────────────────────────────────────────────────

function calcStats() {
  let wins=0, losses=0, pushes=0, pending=0, staked=0, returned=0;
  for (const b of Object.values(bets)) {
    const s = parseFloat(b.stake)||0, o = parseFloat(b.odds)||1;
    staked += s;
    if (b.result==='win')  { wins++;   returned += s*o; }
    else if (b.result==='loss') { losses++; }
    else if (b.result==='push') { pushes++; returned += s; }
    else pending++;
  }
  const settled = wins+losses+pushes;
  return { wins, losses, pushes, pending, staked, pnl: returned-staked,
           winRate: settled ? Math.round(wins/settled*100) : 0 };
}

function renderStats() {
  const s = calcStats();
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill blue"><div class="val">${Object.keys(bets).length}</div><div class="lbl">Bets</div></div>
    <div class="stat-pill green"><div class="val">${s.wins}</div><div class="lbl">Wins</div></div>
    <div class="stat-pill red"><div class="val">${s.losses}</div><div class="lbl">Losses</div></div>
    <div class="stat-pill yellow"><div class="val">${s.pushes}</div><div class="lbl">Pushes</div></div>
    <div class="stat-pill blue"><div class="val">${s.winRate}%</div><div class="lbl">Win Rate</div></div>
    <div class="stat-pill ${s.pnl>=0?'green':'red'}"><div class="val">${s.pnl>=0?'+':''}$${s.pnl.toFixed(0)}</div><div class="lbl">P&amp;L SGD</div></div>
    <div class="stat-pill"><div class="val">$${s.staked.toFixed(0)}</div><div class="lbl">Staked</div></div>`;
}

// ─── GROUPS ───────────────────────────────────────────────────────────────

function calcStandings() {
  const st = {};
  for (const [g, d] of Object.entries(GROUPS)) {
    st[g] = {};
    for (const t of d.teams) st[g][t] = {pts:0,w:0,d:0,l:0,gf:0,ga:0};
  }
  for (const m of GROUP_MATCHES) {
    const b = bets[m.id];
    if (!b || b.score1===undefined || b.score1==='' || b.score2===undefined || b.score2==='') continue;
    const s1=parseInt(b.score1), s2=parseInt(b.score2);
    if (isNaN(s1)||isNaN(s2)) continue;
    const g = st[m.group];
    g[m.home].gf+=s1; g[m.home].ga+=s2;
    g[m.away].gf+=s2; g[m.away].ga+=s1;
    if (s1>s2)      { g[m.home].pts+=3; g[m.home].w++; g[m.away].l++; }
    else if (s2>s1) { g[m.away].pts+=3; g[m.away].w++; g[m.home].l++; }
    else            { g[m.home].pts+=1; g[m.home].d++; g[m.away].pts+=1; g[m.away].d++; }
  }
  return st;
}

function renderGroups() {
  const st = calcStandings();
  document.getElementById('groupsGrid').innerHTML = Object.entries(GROUPS).map(([grp,d]) => {
    const sorted = [...d.teams].sort((a,b) => {
      const da=st[grp][a], db=st[grp][b];
      if (db.pts!==da.pts) return db.pts-da.pts;
      return (db.gf-db.ga)-(da.gf-da.ga);
    });
    return `<div class="group-card">
      <div class="group-header">Group ${grp}</div>
      ${sorted.map((t,i) => `<div class="group-team-row">
        <div class="team-name">
          <div class="qual-dot ${i===0?'q1':i===1?'q2':''}"></div>
          <span>${FLAGS[t]||'🏳️'}</span><span>${t}</span>
        </div>
        <div class="team-stats">
          <span>${st[grp][t].w}W ${st[grp][t].d}D ${st[grp][t].l}L</span>
          <span class="team-pts">${st[grp][t].pts}pt</span>
        </div>
      </div>`).join('')}
    </div>`;
  }).join('');
}

// ─── MATCHES ──────────────────────────────────────────────────────────────

let matchFilter = 'All';

function renderMatchFilters() {
  const opts = ['All','Group Stage',...Object.keys(GROUPS).map(g=>'Group '+g),
    'Round of 32','Round of 16','Quarter-Finals','Semi-Finals','Third Place','Final'];
  document.getElementById('matchFilters').innerHTML = opts.map(o =>
    `<div class="filter-btn ${matchFilter===o?'active':''}" onclick="setMatchFilter('${o}')">${o}</div>`
  ).join('');
}

function setMatchFilter(f) { matchFilter=f; renderMatchFilters(); renderMatches(); }

function betClass(mid) {
  const b=bets[mid]; if(!b) return '';
  return b.result||'has-bet';
}
function betPillHtml(mid) {
  const b=bets[mid];
  if(!b) return `<span class="bet-pill pend">click to bet</span>`;
  const cls = b.result==='win'?'win':b.result==='loss'?'loss':b.result==='push'?'push':'pend';
  const lbl = b.result ? b.result.toUpperCase() : 'PENDING';
  return `<span class="bet-pill ${cls}">$${b.stake}@${b.odds} · ${b.pick} · ${lbl}</span>`;
}

function renderMatches() {
  let list = MATCHES;
  if (matchFilter==='Group Stage') list = GROUP_MATCHES;
  else if (matchFilter!=='All') list = MATCHES.filter(m=>m.stage===matchFilter);

  const byStage = {};
  for (const m of list) { (byStage[m.stage]||(byStage[m.stage]=[])).push(m); }

  if (!list.length) { document.getElementById('matchList').innerHTML='<div class="empty"><div class="empty-icon">🔍</div>No matches</div>'; return; }

  document.getElementById('matchList').innerHTML = Object.entries(byStage).map(([stage,ms]) =>
    `<div class="section-title">${stage}</div>
    <div class="match-list">${ms.map(m => {
      const b=bets[m.id];
      const score = (b?.score1!==undefined&&b.score1!==''&&b?.score2!==undefined&&b.score2!=='')
        ? `<span class="match-score">${b.score1}–${b.score2}</span>`
        : `<span class="match-score" style="color:var(--border)">—</span>`;
      return `<div class="match-card ${betClass(m.id)}" onclick="openModal(${m.id})">
        <div class="match-meta">${m.date}</div>
        <div class="match-teams">${FLAGS[m.home]||'❓'} ${m.home} <span class="match-vs">vs</span> ${FLAGS[m.away]||'❓'} ${m.away}</div>
        ${score}
        ${betPillHtml(m.id)}
      </div>`;
    }).join('')}</div>`
  ).join('');
}

// ─── KNOCKOUT ─────────────────────────────────────────────────────────────

function renderKnockout() {
  const rounds = ['Round of 32','Round of 16','Quarter-Finals','Semi-Finals','Final'];
  document.getElementById('bracket').innerHTML = rounds.map(rnd => {
    const ms = KO_MATCHES.filter(m=>m.stage===rnd);
    return `<div class="b-round">
      <div class="b-round-label">${rnd}</div>
      ${ms.map(m => {
        const b=bets[m.id];
        const s1=b?.score1??'', s2=b?.score2??'';
        const wH = s1!==''&&s2!==''&&parseInt(s1)>parseInt(s2);
        const wA = s1!==''&&s2!==''&&parseInt(s2)>parseInt(s1);
        return `<div class="b-match ${betClass(m.id)}" onclick="openModal(${m.id})">
          <div class="b-team ${wH?'winner':''}">${FLAGS[m.home]||'❓'} ${m.home} <span class="b-score">${s1}</span></div>
          <div class="b-team ${wA?'winner':''}">${FLAGS[m.away]||'❓'} ${m.away} <span class="b-score">${s2}</span></div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('<div style="display:flex;align-items:center;color:var(--border);font-size:22px;padding-top:24px">›</div>');
}

// ─── BETS ─────────────────────────────────────────────────────────────────

let betFilter = 'All';
function renderBetFilters() {
  ['All','Pending','Wins','Losses','Pushes'].forEach(f => {});
  document.getElementById('betFilters').innerHTML = ['All','Pending','Wins','Losses','Pushes'].map(f =>
    `<div class="filter-btn ${betFilter===f?'active':''}" onclick="setBetFilter('${f}')">${f}</div>`
  ).join('');
}
function setBetFilter(f) { betFilter=f; renderBetFilters(); renderBets(); }

function renderBets() {
  let entries = Object.entries(bets).map(([mid,b])=>({mid,b,m:MATCHES.find(x=>x.id==mid)})).filter(x=>x.m);
  if (betFilter==='Pending') entries=entries.filter(x=>!x.b.result);
  else if (betFilter==='Wins')   entries=entries.filter(x=>x.b.result==='win');
  else if (betFilter==='Losses') entries=entries.filter(x=>x.b.result==='loss');
  else if (betFilter==='Pushes') entries=entries.filter(x=>x.b.result==='push');

  if (!entries.length) {
    document.getElementById('betsContent').innerHTML=`<div class="empty"><div class="empty-icon">🎯</div>${Object.keys(bets).length===0?'No bets yet — click any match to place a bet':'No bets match this filter'}</div>`;
    return;
  }

  document.getElementById('betsContent').innerHTML = `<table class="bets-table">
    <thead><tr><th>Date</th><th>Match</th><th>Pick</th><th>Stake / Odds</th><th>Score</th><th>P&amp;L</th><th>Result</th><th></th></tr></thead>
    <tbody>${entries.map(({mid,b,m}) => {
      const s=parseFloat(b.stake)||0, o=parseFloat(b.odds)||1;
      const pnl = b.result==='win'?`+$${(s*o-s).toFixed(0)}`:b.result==='loss'?`-$${s.toFixed(0)}`:b.result==='push'?'$0':'—';
      const pnlColor = b.result==='win'?'var(--win)':b.result==='loss'?'var(--loss)':'var(--muted)';
      const score = (b.score1!==undefined&&b.score1!==''&&b.score2!==undefined&&b.score2!=='')?`${b.score1}–${b.score2}`:'—';
      const badge = b.result?`<span class="badge badge-${b.result}">${b.result.toUpperCase()}</span>`:`<span class="badge badge-pend">PENDING</span>`;
      return `<tr>
        <td>${m.date}</td>
        <td>${FLAGS[m.home]||'❓'} ${m.home} vs ${FLAGS[m.away]||'❓'} ${m.away}</td>
        <td>${b.pick}</td>
        <td>$${b.stake} @ ${b.odds}</td>
        <td>${score}</td>
        <td style="color:${pnlColor};font-weight:600">${pnl}</td>
        <td>${badge}</td>
        <td><button class="btn btn-ghost" style="padding:3px 9px;font-size:11px" onclick="openModal(${mid})">Edit</button></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

// ─── MODAL ────────────────────────────────────────────────────────────────

let currentMid = null;

function openModal(mid) {
  currentMid = mid;
  const m = MATCHES.find(x=>x.id==mid);
  const b = bets[mid]||{};

  document.getElementById('modalTitle').textContent = `${FLAGS[m.home]||'❓'} ${m.home}  vs  ${FLAGS[m.away]||'❓'} ${m.away}`;
  document.getElementById('modalSub').textContent   = `${m.stage}  ·  ${m.date}`;

  const picks = m.ko ? [m.home, m.away] : [m.home, 'Draw', m.away];
  document.getElementById('pickRow').innerHTML = picks.map(p =>
    `<div class="pick-btn ${b.pick===p?'selected':''}" onclick="selectPick(this,'${p}')">${FLAGS[p]||''} ${p}</div>`
  ).join('');

  document.getElementById('stakeInput').value = b.stake||'';
  document.getElementById('oddsInput').value  = b.odds||'';
  document.getElementById('scoreLabel1').textContent = m.home;
  document.getElementById('scoreLabel2').textContent = m.away;
  document.getElementById('score1').value = b.score1??'';
  document.getElementById('score2').value = b.score2??'';

  const hasBet = !!bets[mid];
  document.getElementById('clearBetBtn').style.display    = hasBet?'':'none';
  document.getElementById('recordResultBtn').style.display= hasBet?'':'none';
  document.getElementById('resultSection').style.display  = (hasBet&&b.score1!==undefined&&b.score1!=='')?'':'none';
  document.getElementById('recordResultBtn').textContent  = (hasBet&&b.score1!==undefined&&b.score1!=='')?'Hide Result':'Record Result';

  document.getElementById('betOverlay').classList.add('open');
}

function selectPick(el, val) {
  document.querySelectorAll('.pick-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  el._pick = val;
}
function getSelectedPick() {
  const el = document.querySelector('.pick-btn.selected');
  return el ? (el._pick||el.textContent.trim()) : null;
}

function toggleResult() {
  const rs = document.getElementById('resultSection');
  const btn = document.getElementById('recordResultBtn');
  const show = rs.style.display==='none';
  rs.style.display = show?'':'none';
  btn.textContent  = show?'Hide Result':'Record Result';
}

function saveBet() {
  const pick = getSelectedPick();
  if (!pick) { alert('Select a pick first'); return; }
  const m = MATCHES.find(x=>x.id==currentMid);
  const s1 = document.getElementById('score1').value;
  const s2 = document.getElementById('score2').value;
  const bet = {
    pick,
    stake: document.getElementById('stakeInput').value,
    odds:  document.getElementById('oddsInput').value,
    score1: s1, score2: s2,
  };
  if (s1!==''&&s2!=='') {
    const n1=parseInt(s1), n2=parseInt(s2);
    const winner = n1>n2?m.home:n2>n1?m.away:'Draw';
    bet.result = pick===winner?'win':winner==='Draw'&&pick==='Draw'?'push':'loss';
    if (pick==='Draw'&&winner!=='Draw') bet.result='loss';
    if (pick!=='Draw'&&winner==='Draw') bet.result='push';
  }
  bets[currentMid] = bet;
  saveBets();
  closeModal();
  renderAll();
}

function clearBet() {
  delete bets[currentMid];
  saveBets();
  closeModal();
  renderAll();
}

function closeModal(e) {
  if (e&&e.target!==document.getElementById('betOverlay')) return;
  document.getElementById('betOverlay').classList.remove('open');
}

// ─── TABS ─────────────────────────────────────────────────────────────────

function switchTab(tab) {
  const names = ['groups','matches','knockout','bets'];
  document.querySelectorAll('.nav-tab').forEach((t,i)=>t.classList.toggle('active',names[i]===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if (tab==='groups')   renderGroups();
  if (tab==='matches')  { renderMatchFilters(); renderMatches(); }
  if (tab==='knockout') renderKnockout();
  if (tab==='bets')     { renderBetFilters(); renderBets(); }
}

function renderAll() {
  renderStats();
  const active = document.querySelector('.nav-tab.active');
  const tabs = ['groups','matches','knockout','bets'];
  const idx = [...document.querySelectorAll('.nav-tab')].indexOf(active);
  if (idx>=0) switchTab(tabs[idx]);
}

renderStats();
renderGroups();
renderMatchFilters();
renderMatches();
</script>
